name: Bug report
description: Report reproducible SDK behavior. Never include credentials or customer documents.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, webhook secrets, customer data, or private documents.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 1.0.0-beta.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version
      placeholder: 22.14.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction with artificial data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
